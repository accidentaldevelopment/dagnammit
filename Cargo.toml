[package]
name = "dagnammit"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = [
  'macros',
  'rt-multi-thread',
  'net',
  'signal',
] }
tower-http = { version = "0.6", features = ['trace'] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"

[dev-dependencies]
tower = "0.5.3"
